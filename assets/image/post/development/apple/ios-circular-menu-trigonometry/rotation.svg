<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280">
  <rect width="520" height="280" rx="8" fill="#1e1e2e"/>

  <defs>
    <marker id="arrG" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#a6e3a1"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#f38ba8"/>
    </marker>
  </defs>

  <!-- ===== LEFT: Math (counter-clockwise) ===== -->
  <text x="130" y="28" fill="#cdd6f4" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle" font-weight="600">Math</text>
  <text x="130" y="44" fill="#a6adc8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">counter-clockwise (+)</text>

  <!-- Circle, center=(130,155), r=80 -->
  <circle cx="130" cy="155" r="80" fill="none" stroke="#45475a" stroke-width="1.5"/>

  <!-- CCW arrow: starts at 0°, sweeps CCW 330°, arrowhead near 0° points CCW -->
  <path d="M 210 155 A 80 80 0 1 0 199.3 195"
        fill="none" stroke="#a6e3a1" stroke-width="2.5" marker-end="url(#arrG)"/>

  <!-- Degree labels -->
  <text x="218" y="159" fill="#a6adc8" font-family="-apple-system, sans-serif" font-size="11">0°</text>
  <text x="124" y="65" fill="#a6adc8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">90°</text>
  <text x="35" y="159" fill="#a6adc8" font-family="-apple-system, sans-serif" font-size="11">180°</text>
  <text x="124" y="252" fill="#a6adc8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">270°</text>

  <!-- Points at 0°, 90°, 180°, 270° -->
  <circle cx="210" cy="155" r="3" fill="#a6adc8"/>
  <circle cx="130" cy="75" r="3" fill="#a6adc8"/>
  <circle cx="50" cy="155" r="3" fill="#a6adc8"/>
  <circle cx="130" cy="235" r="3" fill="#a6adc8"/>
  <circle cx="130" cy="155" r="2" fill="#cdd6f4"/>

  <!-- ===== Separator ===== -->
  <line x1="260" y1="40" x2="260" y2="265" stroke="#45475a" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ===== RIGHT: iOS (clockwise) ===== -->
  <text x="390" y="28" fill="#cdd6f4" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle" font-weight="600">iOS</text>
  <text x="390" y="44" fill="#a6adc8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">clockwise (+)</text>

  <!-- Circle, center=(390,155), r=80 -->
  <circle cx="390" cy="155" r="80" fill="none" stroke="#45475a" stroke-width="1.5"/>

  <!-- CW arrow: starts at 0°, sweeps CW 330°, arrowhead near 0° points CW -->
  <path d="M 470 155 A 80 80 0 1 1 459.3 115"
        fill="none" stroke="#f38ba8" stroke-width="2.5" marker-end="url(#arrR)"/>

  <!-- Degree labels -->
  <text x="478" y="159" fill="#a6adc8" font-family="-apple-system, sans-serif" font-size="11">0°</text>
  <text x="384" y="65" fill="#f38ba8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">-90°</text>
  <text x="295" y="159" fill="#a6adc8" font-family="-apple-system, sans-serif" font-size="11">180°</text>
  <text x="384" y="252" fill="#f38ba8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">90°</text>

  <!-- Points at 0°, 90°(bottom), 180°, -90°(top) -->
  <circle cx="470" cy="155" r="3" fill="#a6adc8"/>
  <circle cx="390" cy="75" r="3" fill="#a6adc8"/>
  <circle cx="310" cy="155" r="3" fill="#a6adc8"/>
  <circle cx="390" cy="235" r="3" fill="#a6adc8"/>
  <circle cx="390" cy="155" r="2" fill="#cdd6f4"/>
</svg>
