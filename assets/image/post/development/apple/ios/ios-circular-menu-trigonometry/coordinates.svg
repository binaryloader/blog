<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240">
  <rect width="520" height="240" rx="8" fill="#1e1e2e"/>

  <!-- LEFT: Math coordinate system -->
  <text x="120" y="30" fill="#cdd6f4" font-family="-apple-system, sans-serif" font-size="14" text-anchor="middle" font-weight="600">Math</text>

  <!-- Axes -->
  <line x1="40" y1="140" x2="210" y2="140" stroke="#6c7086" stroke-width="1.5"/>
  <line x1="120" y1="50" x2="120" y2="210" stroke="#6c7086" stroke-width="1.5"/>

  <!-- Arrows -->
  <polygon points="210,140 202,136 202,144" fill="#6c7086"/>
  <polygon points="120,50 116,58 124,58" fill="#6c7086"/>

  <!-- Labels -->
  <text x="215" y="137" fill="#a6adc8" font-family="-apple-system, sans-serif" font-size="13">x</text>
  <text x="125" y="50" fill="#a6adc8" font-family="-apple-system, sans-serif" font-size="13">y</text>

  <!-- y↑ indicator -->
  <text x="95" y="75" fill="#a6e3a1" font-family="-apple-system, sans-serif" font-size="11">+y</text>
  <text x="175" y="155" fill="#a6e3a1" font-family="-apple-system, sans-serif" font-size="11">+x</text>

  <!-- Origin dot -->
  <circle cx="120" cy="140" r="3" fill="#cdd6f4"/>

  <!-- Separator -->
  <line x1="260" y1="40" x2="260" y2="220" stroke="#45475a" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- RIGHT: iOS coordinate system -->
  <text x="390" y="30" fill="#cdd6f4" font-family="-apple-system, sans-serif" font-size="14" text-anchor="middle" font-weight="600">iOS</text>

  <!-- Axes -->
  <line x1="310" y1="140" x2="480" y2="140" stroke="#6c7086" stroke-width="1.5"/>
  <line x1="390" y1="50" x2="390" y2="210" stroke="#6c7086" stroke-width="1.5"/>

  <!-- Arrows -->
  <polygon points="480,140 472,136 472,144" fill="#6c7086"/>
  <polygon points="390,210 386,202 394,202" fill="#6c7086"/>

  <!-- Labels -->
  <text x="485" y="137" fill="#a6adc8" font-family="-apple-system, sans-serif" font-size="13">x</text>
  <text x="395" y="218" fill="#a6adc8" font-family="-apple-system, sans-serif" font-size="13">y</text>

  <!-- y↓ indicator -->
  <text x="398" y="195" fill="#f38ba8" font-family="-apple-system, sans-serif" font-size="11">+y</text>
  <text x="445" y="155" fill="#f38ba8" font-family="-apple-system, sans-serif" font-size="11">+x</text>

  <!-- Origin dot -->
  <circle cx="390" cy="140" r="3" fill="#cdd6f4"/>
</svg>
