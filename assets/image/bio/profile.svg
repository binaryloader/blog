<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2C3E50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34495E;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="url(#bgGradient)"/>
  
  <!-- Circuit board lines -->
  <g stroke="#00B992" stroke-width="0.5" opacity="0.5">
    <path d="M20,40 H180 M40,60 H160 M60,80 H140 M80,100 H120 M60,120 H140 M40,140 H160 M20,160 H180" />
    <path d="M40,20 V180 M60,40 V160 M80,60 V140 M100,80 V120 M120,60 V140 M140,40 V160 M160,20 V180" />
  </g>
  
  <!-- Rotating binary numbers (ASCII for "BinaryLoader") -->
  <g id="binary-ring">
    <path id="circle-path" d="M100,50 A50,50 0 0,1 100,150 A50,50 0 0,1 100,50" fill="none" />
    <text font-family="Courier, monospace" font-size="9" fill="#00B992">
      <textPath href="#circle-path">0100001001101001011011100110000101110010011110010100110001101111011000010110010001100101011100100100001001101001011011100110000101110010</textPath>
    </text>
    <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 100 100" to="360 100 100" dur="20s" repeatCount="indefinite"/>
  </g>
  
  <!-- Central chip -->
  <rect x="85" y="85" width="30" height="30" fill="#00B992" rx="5" ry="5" filter="url(#glow)"/>
  <rect x="90" y="90" width="20" height="20" fill="none" stroke="#2C3E50" stroke-width="2"/>
  <line x1="90" y1="100" x2="110" y2="100" stroke="#2C3E50" stroke-width="2"/>
  <line x1="100" y1="90" x2="100" y2="110" stroke="#2C3E50" stroke-width="2"/>
</svg>
